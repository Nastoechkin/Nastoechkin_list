    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vintage: {
                            bg: '#f0e6d2',
                            card: '#fdfbf7',
                            dark: '#2c1810',
                            accent: '#8b4513',
                            border: '#d4c5a5'
                        }
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        body: ['"Lora"', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* --- ВАШ ШРИФТ ТОЛЬКО ДЛЯ НАЗВАНИЙ --- */
        @font-face {
            font-family: 'MyCustomFont';
            /* Убедитесь, что файл называется именно так и лежит рядом */
            src: url('./elanmedium.ttf') format('truetype'); 
            font-weight: normal;
            font-style: normal;
        }

        body {
            background-color: #f0e6d2; /* Цвет подложки, если картинка не загрузится */
            color: #2c1810;
            font-family: 'Lora', serif; /* Основной шрифт для всего сайта */
            
            /* --- НАСТРОЙКА ФОНА --- */
            /* Чтобы заработало, положите файл bg.jpg рядом с index.html */
            background-image: url('./bg.jpg'), url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            
            background-size: cover;      /* Картинка растягивается на весь экран */
            background-position: center; /* Центрирование */
            background-attachment: fixed;/* Фон стоит на месте при прокрутке */
            background-repeat: no-repeat;
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(240, 230, 210, 0.5); }
        ::-webkit-scrollbar-thumb { background: #8b4513; border-radius: 4px; }

        .vintage-header {
            /* Делаем шапку чуть прозрачной, чтобы было видно красивый фон при скролле */
            background: rgba(240, 230, 210, 0.95);
            backdrop-filter: blur(5px);
            border-bottom: 2px solid #8b4513;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 4px 6px -1px rgba(44, 24, 16, 0.1);
        }

        .vintage-card {
            background-color: #fdfbf7;
            border: 1px solid #d4c5a5;
            box-shadow: 4px 4px 0px rgba(139, 69, 19, 0.1);
            transition: all 0.3s ease;
            position: relative;
        }

        .vintage-card::before {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px dashed #e5dcc5;
            pointer-events: none;
        }

        .vintage-card:hover {
            transform: translateY(-2px);
            box-shadow: 6px 6px 0px rgba(139, 69, 19, 0.15);
            border-color: #8b4513;
        }

        .vintage-input {
            background-color: rgba(255, 255, 255, 0.5);
            border: 2px solid #8b4513;
            color: #2c1810;
        }
        .vintage-input::placeholder {
            color: #8b4513; opacity: 0.6; font-style: italic;
        }
        
        /* Стили для SVG логотипа */
        .logo-container svg {
            /* УВЕЛИЧИЛ РАЗМЕР */
            max-height: 160px; 
            width: auto;
            max-width: 100%;
            fill: #2c1810;
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.1));
        }

        /* Класс для названий настоек вашим шрифтом */
        .nastoyka-title {
            font-family: 'MyCustomFont', serif;
            font-size: 1.6rem; /* Чуть крупнее, так как кастомные шрифты часто мелкие */
            letter-spacing: 0.5px;
        }
    </style>
</head>

            <div class="relative max-w-xl mx-auto">
                <input 
                    v-model="searchQuery" 
                    type="text" 
                    placeholder="Найти настойку..." 
                    class="vintage-input w-full pl-10 pr-4 py-3 rounded-md focus:outline-none focus:ring-1 focus:ring-vintage-accent text-lg font-serif"
                >
                <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-vintage-accent opacity-70"></i>
                <button 
                    v-if="searchQuery" 
                    @click="searchQuery = ''"
                    class="absolute right-3 top-1/2 transform -translate-y-1/2 text-vintage-accent hover:text-red-800 transition-colors"

        <div class="flex justify-between items-end mb-4 border-b border-vintage-accent border-opacity-20 pb-2">
            <span class="text-vintage-accent italic text-lg font-serif">Каталог</span>
            <span class="text-sm text-vintage-dark opacity-60 font-mono">Всего: {{ filteredList.length }}</span>
        </div>

        <div v-if="filteredList.length === 0" class="text-center py-20 text-vintage-accent opacity-60">
            <i class="fas fa-wine-bottle text-5xl mb-4"></i>
            <p class="text-xl italic font-serif">В погребе пусто...</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5">
            <div 
                v-for="(item, index) in filteredList" 
                :key="index"

                    .map(name => ({ name }));
            },
            filteredList() {
                const query = this.searchQuery.toLowerCase();
                return this.nastoykas.filter(item => 
                    item.name.toLowerCase().includes(query)
                );
            },

        methods: {
            isSpicy(name) {
                const n = name.toLowerCase();
                return n.includes('острая') || n.includes('жгуч') || n.includes('перцов') || n.includes('спайси') || n.includes('хрен') || n.includes('васаби');
            },
            isCreamy(name) {
                const n = name.toLowerCase();
                return n.includes('сливочн') || n.includes('йогурт');
            },
            isBS(name) {

            },
            isChoco(name) {
